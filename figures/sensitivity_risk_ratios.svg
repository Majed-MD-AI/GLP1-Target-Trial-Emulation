="7" class="pt"/><text x="699.890909090909" y="220" class="lab">1.40</text><text x="235" y="275" text-anchor="end" class="lab">Truncated 5th–95th</text><circle cx="745.2727272727273" cy="270" r="7" class="pt"/><text x="757.2727272727273" y="275" class="lab">1.45</text><text x="235" y="330" text-anchor="end" class="lab">Common-support trimmed</text><circle cx="660.0727272727272" cy="325" r="7" class="pt"/><text x="672.0727272727272" y="330" class="lab">1.38</text><text x="235" y="385" text-anchor="end" class="lab">Alternative 0–30 vs 31–180d</text><circle cx="468.39999999999986" cy="380" r="7" class="pt"/><text x="480.39999999999986" y="385" class="lab">1.20</text><text x="550" y="485" text-anchor="middle" class="lab">Adjusted risk ratio</text><text x="250" y="465" class="note">Alternative 0–30 day analysis uses a different treatment definition and is not the same estimand.</text></svg>