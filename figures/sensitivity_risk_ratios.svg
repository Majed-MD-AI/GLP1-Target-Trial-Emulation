<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
<style>
text{font-family:Arial,sans-serif;fill:#222}.title{font-size:24px;font-weight:700}.lab{font-size:15px}.axis{font-size:12px}.pt{fill:#111}.grid{stroke:#ddd;stroke-width:1}.null{stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}.note{font-size:12px;fill:#555}
</style><rect width="100%" height="100%" fill="white"/>
